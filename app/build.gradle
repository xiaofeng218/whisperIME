plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def quoteBuildConfigString = { value ->
    return '"' + value.toString()
            .replace('\\', '\\\\')
            .replace('"', '\\"') + '"'
}

def defaultServerBaseUrl = project.findProperty("DEFAULT_SERVER_BASE_URL") ?: "http://43.143.17.185:8000"
def defaultCustomModelUrl = project.findProperty("DEFAULT_CUSTOM_MODEL_URL") ?: "https://modelscope.cn/models/hanxiaofeng218/ASR-Whisper-Small-Model/resolve/master/whisper-small.tflite"

android {
    namespace 'com.whispertflite'
    compileSdk 35

    lintOptions{
        disable 'MissingTranslation'
    }
    
    defaultConfig {
        applicationId "org.woheller69.whisper"
        minSdk 28
        targetSdk 35
        versionCode 36
        versionName "3.6"
        buildConfigField "String", "DEFAULT_SERVER_BASE_URL", quoteBuildConfigString(defaultServerBaseUrl)
        buildConfigField "String", "DEFAULT_CUSTOM_MODEL_URL", quoteBuildConfigString(defaultCustomModelUrl)

    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    // Removed externalNativeBuild block

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    dependenciesInfo {
        // Disable including dependency metadata when building APKs
        includeInApk = false
        // Disable including dependency metadata when building Android App Bundles
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.preference:preference:1.2.1'

    // Main TensorFlow Lite library
    //noinspection GradleDependency: Crash with 2.16.1, nonsense output with com.google.ai.edge.litert:litert:1.0.1
    implementation 'org.tensorflow:tensorflow-lite:2.15.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.9'
    implementation 'com.github.houbb:opencc4j:1.8.1'
    implementation 'com.github.woheller69:FreeDroidWarn:+'

    testImplementation 'junit:junit:4.13.2'
}
